name: Build Android (S905)

on:
  # 推送到 main 时自动构建（Artifacts 供下载验证）
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  # 也可在 Actions 页面手动触发构建
  workflow_dispatch:

jobs:
  build-android:
    name: Build iptv-speed-tester-armv7 (32-bit)
    runs-on: ubuntu-latest
    env:
      NDK_VER: r26d
      NDK_DIR: android-ndk-r26d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存解压后的 NDK（约 1.5GB），命中则跳过下载
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: android-ndk-r26d
          key: android-ndk-r26d-linux-x64

      # 固定 URL 自下载 NDK，路径完全确定，不依赖第三方 action 的 PATH 行为
      - name: Download & extract Android NDK (if not cached)
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL -o ndk.zip "https://dl.google.com/android/repository/${NDK_DIR}-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip
          test -x "${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"

      # 把 NDK 路径写入 GITHUB_ENV / GITHUB_PATH，供后续 step 运行时使用。
      # 注意: 禁止用 ${{ env.ANDROID_NDK_HOME }} —— 它在 workflow 编译期求值恒为空。
      - name: Configure NDK environment
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/${NDK_DIR}" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build release binary (armv7-linux-androideabi)
        run: |
          set -euo pipefail

          # 运行时读取 shell 环境变量（由上一 step 的 GITHUB_ENV 写入）
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          test -x "$NDK_BIN/armv7a-linux-androideabi24-clang" \
            || { echo "::error::NDK clang 不存在: $NDK_BIN/armv7a-linux-androideabi24-clang"; exit 1; }
          test -x "$NDK_BIN/llvm-ar" \
            || { echo "::error::NDK llvm-ar 不存在"; exit 1; }

          # cc-rs 通过 CC_<target> / AR_<target> (target 中 - 变 _、转大写) 查找
          # 交叉 C 编译器，用于编译 ring 等含 C/汇编代码的依赖。
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi24-clang"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"

          echo "::group::Cargo build"
          cargo build --locked \
            --release \
            --no-default-features \
            --features android \
            --target armv7-linux-androideabi
          echo "::endgroup::"

          BIN=target/armv7-linux-androideabi/release/iptv-speed-tester

          # NDK 的 strip 进一步瘦身（release profile 已 strip symbols，这里再清一遍）
          "$NDK_BIN/llvm-strip" "$BIN"

          echo "Binary size: $(du -h "$BIN" | cut -f1)"
          file "$BIN"

          # 组织发布包
          mkdir -p dist/iptv-speed-tester-armv7
          cp "$BIN" dist/iptv-speed-tester-armv7/iptv
          cp README.md dist/iptv-speed-tester-armv7/README.md
          cp ANDROID-S905.md dist/iptv-speed-tester-armv7/ 2>/dev/null || true
          cp LICENSE* dist/iptv-speed-tester-armv7/ 2>/dev/null || true

          # GitHub runner 时区为 UTC，将文件 mtime 调 +8h，
          # 使 zip 时间字段显示为上海本地时间（盒子上解压不再差 8 小时）
          find dist/iptv-speed-tester-armv7 -type f -exec touch -m -d "+8 hours" {} +

          # 不再手动打 zip：upload-artifact 直接上传目录，
          # GitHub 侧会打成一枚一级 zip，下载解压后直接得到 iptv 二进制
          #（避免 v4 先用手打 zip 再被外层再包一次导致两次解压）
          echo "--- dist dir (Shanghai-adjusted mtimes) ---"
          ls -lhR --full-time dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-speed-tester-armv7
          path: dist/iptv-speed-tester-armv7
          if-no-files-found: error
          retention-days: 30

  # 打 tag（v*）时自动把二进制附加到 GitHub Release
  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Show artifacts
        run: ls -lhR release-artifacts

      # artifact 下载已被解压为目录，重新打成一枚一级 zip 供 release 附件
      - name: Package release zip (single-level)
        run: |
          set -euo pipefail
          cd release-artifacts
          # 同样把文件时间调成上海本地时间
          find . -type f -exec touch -m -d "+8 hours" {} +
          zip -r iptv-speed-tester-armv7.zip . -x "*.zip"
          cd ..
          ls -lh --full-time release-artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/iptv-speed-tester-armv7.zip
          generate_release_notes: true
          draft: false
          prerelease: false
