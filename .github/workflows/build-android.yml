name: Build Android (S905)

on:
  # 推送 v* 标签时自动构建并发布到 GitHub Release
  push:
    tags: [ 'v*' ]
  # 也可在 Actions 页面手动触发构建
  workflow_dispatch:

jobs:
  build-android:
    name: Build iptv-speed-tester-armv7 (32-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          # 将 NDK 的 clang 工具链加入 PATH，供 .cargo/config.toml 的 linker 使用
          add-to-path: true
          local-cache: true

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build release binary (armv7-linux-androideabi)
        run: |
          set -euo pipefail

          # nttld/setup-ndk 的 add-to-path 已把 NDK clang 加入 PATH。
          # 这里在运行时用 command -v 反查真实路径（不能用 ${{ env.ANDROID_NDK_HOME }}，
          # 它会在 workflow 编译期求值且此时尚未设置，导致空路径 /toolchains/...）。
          CLANG="$(command -v armv7a-linux-androideabi24-clang)"
          if [[ -z "$CLANG" ]]; then
            echo "::error::找不到 NDK clang，请检查 nttld/setup-ndk 的 add-to-path"
            exit 1
          fi
          NDK_BIN="$(dirname "$CLANG")"
          echo "NDK_BIN=$NDK_BIN"
          ls "$NDK_BIN" | grep -E 'armv7a-linux-androideabi24-clang|llvm-ar' || true

          # cc-rs 通过 CC_<target> / AR_<target> (target 中 - 变 _、转大写) 查找
          # 交叉 C 编译器，用于编译 ring 等含 C/汇编代码的依赖。
          export CC_armv7_linux_androideabi="$CLANG"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"

          echo "::group::Cargo build"
          cargo build --locked \
            --release \
            --no-default-features \
            --features android \
            --target armv7-linux-androideabi
          echo "::endgroup::"

          BIN=target/armv7-linux-androideabi/release/iptv-speed-tester

          # NDK 的 strip 进一步瘦身（release profile 已 strip symbols，这里再清一遍）
          "$NDK_BIN/llvm-strip" "$BIN"

          echo "Binary size: $(du -h "$BIN" | cut -f1)"
          file "$BIN"

          # 组织发布包
          mkdir -p dist/iptv-speed-tester-armv7
          cp "$BIN" dist/iptv-speed-tester-armv7/iptv
          cp README.md dist/iptv-speed-tester-armv7/README.md
          cp ANDROID-S905.md dist/iptv-speed-tester-armv7/ 2>/dev/null || true
          cp LICENSE* dist/iptv-speed-tester-armv7/ 2>/dev/null || true

          # 使用 zip 打包，便于 Android 7.1 上的文件管理器解压
          cd dist
          zip -r iptv-speed-tester-armv7.zip iptv-speed-tester-armv7
          cd ..

      - name: Show build result
        run: ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-speed-tester-armv7
          path: dist/iptv-speed-tester-armv7.zip
          retention-days: 30

  # 打 tag（v*）时自动把二进制附加到 GitHub Release
  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Show artifacts
        run: ls -lhR release-artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
